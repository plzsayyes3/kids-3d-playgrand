<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>つながる3Dこうさく</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#20252b;--accent:#356df3;--ok:#16884a;--bad:#d33f49;--cut:#dc4455}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{position:fixed;inset:0}
#app{height:100%;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.bar{display:flex;gap:8px;align-items:center;padding:9px max(9px,env(safe-area-inset-right)) 9px max(9px,env(safe-area-inset-left));background:var(--panel);overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid #dde2e7;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.modebar{justify-content:center;padding-top:7px;padding-bottom:7px;background:#f9fafb}
.bottom{border-top:1px solid #dde2e7;border-bottom:0;padding-bottom:max(9px,env(safe-area-inset-bottom))}
.btn{border:0;border-radius:13px;min-height:44px;min-width:44px;padding:10px 13px;font-size:16px;font-weight:700;background:#edf1f5;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.shape{background:#e9efff}.primary{background:var(--accent);color:#fff}.danger{background:#ffe9e9;color:#a3212a}.cutAction{background:#ffe5e9;color:#a3212a}.cutAction:not(:disabled){background:var(--cut);color:#fff}.btn:disabled{opacity:.35}.active{background:#20252b;color:#fff}.op.active.add{background:#356df3}.op.active.cut{background:var(--cut)}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.hint,.status,.error{position:absolute;z-index:3;background:rgba(255,255,255,.93);border-radius:12px;padding:9px 11px;font-size:13px;box-shadow:0 3px 16px #0001;pointer-events:none}
.hint{left:max(10px,env(safe-area-inset-left));top:10px;max-width:365px}.status{right:max(10px,env(safe-area-inset-right));top:10px;font-weight:800}.error{display:none;left:10px;right:10px;bottom:10px;color:#a3212a;border:1px solid #efb6b6}.brand{font-weight:900}
@media(max-width:700px){.brand{display:none}.btn{font-size:15px}.hint{font-size:12px;max-width:285px}.modebar{justify-content:flex-start}}
</style>
</head>
<body>
<div id="app">
<header class="bar">
<span class="brand">つながる3Dこうさく</span>
<button class="btn shape" data-add="box">□ はこ</button>
<button class="btn shape" data-add="sphere">● まる</button>
<button class="btn shape" data-add="cylinder">▰ ぼう</button>
<button class="btn shape" data-add="cone">△ とんがり</button>
<button id="copy" class="btn">⧉ コピー</button>
<button id="del" class="btn danger">✕ けす</button>
<button id="export" class="btn primary" disabled>できた！ STL</button>
</header>
<nav class="bar modebar">
<button class="btn op add active" data-op="add">＋ つける</button>
<button class="btn op cut" data-op="cut">− きりぬく</button>
<button id="applyCut" class="btn cutAction" disabled>✂ きりぬく！</button>
<span id="opHelp">次に置く形は「つける」パーツです</span>
</nav>
<main id="stage">
<div class="hint">重力はありません。空中に置いてOK。<br>赤い形を本体に重ねて「✂ きりぬく！」を押すと、穴だけが残ります。</div>
<div id="status" class="status">3Dをよみこみ中…</div>
<div id="error" class="error">3Dの読み込みに失敗しました。Safariを再読み込みしてください。</div>
</main>
<footer class="bar bottom">
<button class="btn active" data-mode="translate">↔ うごかす</button>
<button class="btn" data-mode="rotate">↻ まわす</button>
<button class="btn" data-mode="scale">⤢ おおきさ</button>
<button id="swap" class="btn">＋/− えらんだ形を反転</button>
<button id="snap" class="btn">🧲 くっつけ補助: ON</button>
<button id="home" class="btn">⌂ ぜんぶ見る</button>
</footer>
</div>
<script>
setTimeout(()=>{if(!window.__kids3dReady){const e=document.getElementById('error');e.style.display='block';e.style.pointerEvents='auto'}},10000);
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.7/build/index.module.js","three-bvh-csg":"https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
import {STLExporter} from 'three/addons/exporters/STLExporter.js';
import {Brush, Evaluator, SUBTRACTION} from 'three-bvh-csg';

const stage=document.getElementById('stage');
const status=document.getElementById('status');
const exportBtn=document.getElementById('export');
const errorBox=document.getElementById('error');
const opHelp=document.getElementById('opHelp');
const applyCutBtn=document.getElementById('applyCut');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}
catch(err){errorBox.textContent='この端末では3D表示を開始できませんでした。';errorBox.style.display='block';throw err}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf6f7f9);
const camera=new THREE.PerspectiveCamera(45,1,.1,1000);camera.position.set(11,9,13);
scene.add(new THREE.HemisphereLight(0xffffff,0xb7c0ca,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(7,12,8);sun.castShadow=true;scene.add(sun);
scene.add(new THREE.GridHelper(30,30,0xaab3bd,0xd7dde4));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.35,side:THREE.DoubleSide}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,1,0);orbit.minDistance=4;orbit.maxDistance=45;orbit.screenSpacePanning=true;
let transformDragged=false;
const transform=new TransformControls(camera,renderer.domElement);transform.setSize(1.35);scene.add(transform.getHelper());transform.addEventListener('dragging-changed',e=>{orbit.enabled=!e.value;if(e.value)transformDragged=true});transform.addEventListener('objectChange',()=>{if(snapOn)snap();updateState()});
const parts=[];let selected=null,snapOn=true,color=0,opMode='add';const colors=[0xffb84d,0x62b6ff,0x8fd36b,0xff8298,0xb29cff,0xffd45f];const EPS=.09;
function geom(t){if(t==='box')return new THREE.BoxGeometry(2,2,2);if(t==='sphere')return new THREE.SphereGeometry(1.12,32,20);if(t==='cylinder')return new THREE.CylinderGeometry(1,1,2.5,32);return new THREE.ConeGeometry(1.2,2.6,32)}
function stylePart(m){const cut=m.userData.op==='cut';m.material.color.setHex(cut?0xdc4455:(m.userData.baseColor||0x62b6ff));m.material.transparent=cut;m.material.opacity=cut?.42:1;m.material.depthWrite=!cut;m.material.wireframe=false}
function addPart(t,pos,forcedOp){const op=forcedOp||opMode;const baseColor=colors[color++%colors.length];const m=new THREE.Mesh(geom(t),new THREE.MeshStandardMaterial({color:baseColor,roughness:.55}));m.userData={type:t,op,baseColor};m.position.copy(pos||new THREE.Vector3(0,1.2,0));m.castShadow=op==='add';m.receiveShadow=op==='add';stylePart(m);scene.add(m);parts.push(m);select(m);updateState();return m}
function select(o){selected=o;transform.detach();if(o)transform.attach(o);for(const p of parts)p.material.emissive.setHex(p===o?0x181818:0);updateState()}
function box(o,pad=0){o.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(o);if(pad)b.expandByScalar(pad);return b}
function touching(a,b){return box(a,EPS).intersectsBox(box(b,EPS))}function groundTouch(p){return box(p).min.y<=EPS}
function overlapVolume(a,b){const A=box(a),B=box(b);return Math.min(A.max.x,B.max.x)-Math.max(A.min.x,B.min.x)>EPS&&Math.min(A.max.y,B.max.y)-Math.max(A.min.y,B.min.y)>EPS&&Math.min(A.max.z,B.max.z)-Math.max(A.min.z,B.min.z)>EPS}
function solids(){return parts.filter(p=>p.userData.op==='add')}function cutters(){return parts.filter(p=>p.userData.op==='cut')}
function connectedSet(){const ss=solids(),set=new Set(),q=[];for(const p of ss)if(groundTouch(p)){set.add(p);q.push(p)}while(q.length){const a=q.shift();for(const p of ss)if(!set.has(p)&&touching(a,p)){set.add(p);q.push(p)}}return set}
function setOpMode(mode){opMode=mode;document.querySelectorAll('[data-op]').forEach(x=>x.classList.toggle('active',x.dataset.op===mode));opHelp.textContent=mode==='add'?'次に置く形は「つける」パーツです':'赤い形を置いて、本体に重ねてね'}
function cutReady(){return !!selected&&selected.userData.op==='cut'&&solids().some(s=>overlapVolume(s,selected))}
function updateState(){const ss=solids(),cc=cutters(),c=connectedSet(),ready=cutReady();for(const p of ss){p.material.transparent=true;p.material.opacity=c.has(p)?1:.55;p.material.depthWrite=true}for(const p of cc)stylePart(p);applyCutBtn.disabled=!ready;const connected=ss.length>0&&c.size===ss.length;exportBtn.disabled=!(connected&&cc.length===0);if(!ss.length){status.textContent='まず ＋ で形を置いてね';status.style.color='#20252b'}else if(ready){status.textContent='✂ 「きりぬく！」を押してね';status.style.color='#dc4455'}else if(cc.length){status.textContent=selected&&selected.userData.op==='cut'?'赤い形を本体に少し重ねてね':'赤い形をえらんでね';status.style.color='#d33f49'}else if(!connected){status.textContent=`あと ${ss.length-c.size} こ 地面につなげよう`;status.style.color='#d33f49'}else{status.textContent='✓ STLにできる！';status.style.color='#16884a'}}
function snap(){if(!selected)return;const s=.25;selected.position.x=Math.round(selected.position.x/s)*s;selected.position.z=Math.round(selected.position.z/s)*s;if(selected.userData.op==='add'){const b=box(selected);if(Math.abs(b.min.y)<.22)selected.position.y-=b.min.y}}
function copy(){if(!selected)return;const c=selected.clone();c.geometry=selected.geometry.clone();c.material=selected.material.clone();c.userData={...selected.userData};c.position.x+=1;c.position.y+=.4;scene.add(c);parts.push(c);select(c);updateState()}
function disposePart(p){if(p.geometry)p.geometry.dispose();if(Array.isArray(p.material))p.material.forEach(m=>m.dispose());else if(p.material)p.material.dispose()}
function del(){if(!selected)return;const doomed=selected,i=parts.indexOf(doomed);if(i>=0)parts.splice(i,1);scene.remove(doomed);selected=null;transform.detach();disposePart(doomed);updateState()}
function swapOp(){if(!selected)return;selected.userData.op=selected.userData.op==='add'?'cut':'add';stylePart(selected);selected.castShadow=selected.userData.op==='add';selected.receiveShadow=selected.userData.op==='add';updateState()}
function fit(){if(!parts.length)return;const b=new THREE.Box3();for(const p of parts)b.union(box(p));const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z,4);orbit.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(m*1.5,m*1.2,m*1.7));orbit.update()}
function brushFrom(mesh){const g=mesh.geometry.clone();g.clearGroups();g.deleteAttribute('uv');const b=new Brush(g);b.position.copy(mesh.position);b.quaternion.copy(mesh.quaternion);b.scale.copy(mesh.scale);b.updateMatrixWorld(true);return b}
function subtractMesh(base,cutter){const evaluator=new Evaluator();evaluator.useGroups=false;evaluator.attributes=['position','normal'];const a=brushFrom(base),b=brushFrom(cutter),result=evaluator.evaluate(a,b,SUBTRACTION),geo=result.geometry.clone();a.geometry.dispose();b.geometry.dispose();result.geometry.dispose();geo.clearGroups();geo.setDrawRange(0,Infinity);const pos=geo.getAttribute('position');if(!pos||!pos.count){geo.dispose();return null}const out=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:base.userData.baseColor||0x62b6ff,roughness:.55}));out.position.copy(result.position);out.quaternion.copy(result.quaternion);out.scale.copy(result.scale);out.userData={type:'boolean',op:'add',baseColor:base.userData.baseColor||0x62b6ff};out.castShadow=true;out.receiveShadow=true;out.updateMatrixWorld(true);return out}
function commitCut(){if(!cutReady())return;const cutter=selected,targets=solids().filter(s=>overlapVolume(s,cutter)),old=applyCutBtn.textContent;applyCutBtn.disabled=true;applyCutBtn.textContent='きりぬき中…';errorBox.style.display='none';const results=[];try{for(const target of targets)results.push({target,result:subtractMesh(target,cutter)});const remove=new Set([...targets,cutter]);for(const p of remove){scene.remove(p);disposePart(p)}for(let i=parts.length-1;i>=0;i--)if(remove.has(parts[i]))parts.splice(i,1);for(const {result} of results)if(result){scene.add(result);parts.push(result)}const next=results.find(x=>x.result)?.result||solids()[0]||null;select(next);setOpMode('add');opHelp.textContent='切り抜けた！ 次は「つける」パーツです';updateState()}catch(err){for(const {result} of results)if(result)disposePart(result);console.error(err);errorBox.textContent='うまく切り抜けませんでした。赤い形を少し深く重ねて、もう一度ためしてください。';errorBox.style.display='block'}finally{applyCutBtn.textContent=old;updateState()}}
function exportSTL(){if(exportBtn.disabled)return;exportBtn.disabled=true;const old=exportBtn.textContent;exportBtn.textContent='STLをつくってる…';errorBox.style.display='none';const group=new THREE.Group(),temp=[];try{for(const p of solids()){p.updateMatrixWorld(true);const geo=p.geometry.clone();geo.applyMatrix4(p.matrixWorld);geo.clearGroups();geo.setDrawRange(0,Infinity);const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial());group.add(mesh);temp.push(mesh)}const data=new STLExporter().parse(group,{binary:true});const blob=new Blob([data],{type:'model/stl'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my_3d_model.stl';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1500)}catch(err){console.error(err);errorBox.textContent='STLを作れませんでした。形を少し動かして、もう一度ためしてください。';errorBox.style.display='block'}finally{for(const m of temp){m.geometry.dispose();m.material.dispose()}exportBtn.textContent=old;updateState()}}
const ray=new THREE.Raycaster(),pt=new THREE.Vector2(),activePointers=new Set();let tapStart=null;
function pickAt(x,y){const r=renderer.domElement.getBoundingClientRect();pt.x=((x-r.left)/r.width)*2-1;pt.y=-((y-r.top)/r.height)*2+1;ray.setFromCamera(pt,camera);const h=ray.intersectObjects(parts,false);select(h.length?h[0].object:null)}
renderer.domElement.addEventListener('pointerdown',e=>{activePointers.add(e.pointerId);if(activePointers.size===1&&!transform.dragging){tapStart={id:e.pointerId,x:e.clientX,y:e.clientY}}else tapStart=null});
renderer.domElement.addEventListener('pointermove',e=>{if(!tapStart||tapStart.id!==e.pointerId)return;if(Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>8)tapStart=null});
renderer.domElement.addEventListener('pointerup',e=>{const tap=!!tapStart&&tapStart.id===e.pointerId&&!transformDragged&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)<=8;activePointers.delete(e.pointerId);if(tap)pickAt(e.clientX,e.clientY);if(activePointers.size===0){tapStart=null;transformDragged=false;orbit.enabled=true}});
renderer.domElement.addEventListener('pointercancel',e=>{activePointers.delete(e.pointerId);if(activePointers.size===0){tapStart=null;transformDragged=false;orbit.enabled=true}});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addPart(b.dataset.add)));
document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>setOpMode(b.dataset.op)));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');transform.setMode(b.dataset.mode)}));
document.getElementById('copy').addEventListener('click',copy);document.getElementById('del').addEventListener('click',del);document.getElementById('swap').addEventListener('click',swapOp);applyCutBtn.addEventListener('click',commitCut);exportBtn.addEventListener('click',exportSTL);document.getElementById('home').addEventListener('click',fit);document.getElementById('snap').addEventListener('click',e=>{snapOn=!snapOn;e.currentTarget.textContent=`🧲 くっつけ補助: ${snapOn?'ON':'OFF'}`});
function resize(){const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}const ro=new ResizeObserver(resize);ro.observe(stage);window.addEventListener('orientationchange',()=>setTimeout(resize,150));window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);resize();
addPart('box',new THREE.Vector3(0,1,0),'add');fit();window.__kids3dReady=true;window.__kids3d={parts,addPart,connectedSet,subtractMesh,commitCut,diagnostics:{webgl:renderer.capabilities.isWebGL2?'WebGL2':'WebGL1',touch:navigator.maxTouchPoints||0,pixelRatio:renderer.getPixelRatio(),cutCommit:true}};
let raf=0;function loop(){raf=requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera)}loop();document.addEventListener('visibilitychange',()=>{if(document.hidden&&raf){cancelAnimationFrame(raf);raf=0}else if(!document.hidden&&!raf)loop()});
</script>
</body>
</html>
